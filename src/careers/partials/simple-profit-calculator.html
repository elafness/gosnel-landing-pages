<!--
  Simple marketing profit calculator for SP / RP / MR job pages.
  Set before include:
    window.GOSNEL_PROFIT_CALC = { role: 'sp' | 'rp' | 'mr', applyUrl: '...' }
-->
<section id="earn-estimate" class="rounded-3xl border border-teal-100 bg-gradient-to-br from-brand-soft to-white p-6 sm:p-8 shadow-sm">
  <div class="flex items-start gap-3 mb-2">
    <span class="inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-brand text-slate-900 shrink-0">
      <i data-lucide="calculator" class="w-5 h-5"></i>
    </span>
    <div>
      <h2 class="text-2xl font-black text-slate-900">Estimate your profit</h2>
      <p id="pc-subtitle" class="text-sm text-slate-600 mt-1">See how the job works with a simple example. Change the numbers to match your plan.</p>
    </div>
  </div>

  <div class="mt-5 grid sm:grid-cols-3 gap-3">
    <label class="block">
      <span class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5">
        <i data-lucide="circle-dollar-sign" class="w-3.5 h-3.5"></i>
        Meal Price
      </span>
      <input
        id="pc-meal"
        type="number"
        min="0"
        step="1"
        value="25"
        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-base font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand"
      />
    </label>
    <label class="block">
      <span class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5">
        <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i>
        Orders Per Day
      </span>
      <input
        id="pc-orders"
        type="number"
        min="0"
        step="1"
        value="10"
        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-base font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand"
      />
    </label>
    <label class="block">
      <span class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5">
        <i data-lucide="store" class="w-3.5 h-3.5"></i>
        Active Restaurants
      </span>
      <input
        id="pc-restaurants"
        type="number"
        min="0"
        step="1"
        value="16"
        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-base font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand"
      />
    </label>
  </div>

  <div class="mt-5 rounded-2xl bg-white border border-teal-100 p-5 sm:p-6">
    <p id="pc-result" class="text-slate-700 text-sm sm:text-base leading-relaxed text-left"></p>
    <p id="pc-profit" class="mt-4 text-2xl sm:text-3xl font-black text-brand-dark text-center"></p>
    <p id="pc-cta-line" class="mt-2 text-sm text-slate-500 text-center"></p>
  </div>

  <div class="mt-5 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
    <p class="text-xs text-slate-500">Example only. Real earnings depend on real restaurants and real orders.</p>
    <a
      id="pc-apply"
      href="#"
      class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800 transition"
    >
      Apply now
      <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </a>
  </div>
</section>

<script>
(function () {
  var cfg = window.GOSNEL_PROFIT_CALC || {};
  var role = cfg.role === 'rp' ? 'rp' : (cfg.role === 'mr' ? 'mr' : 'sp');
  var applyUrl = cfg.applyUrl || (
    role === 'mr' ? 'https://admin.gosnel.com/apply?track=master_recruiter'
    : role === 'rp' ? 'https://admin.gosnel.com/apply?track=recruiter'
    : 'https://admin.gosnel.com/apply?track=field_sales'
  );

  var FEE = 0.15;
  var SP_MAX = 0.25;
  var RP_MAX = 0.15;
  var MR_MAX = 0.075;

  var mealEl = document.getElementById('pc-meal');
  var ordersEl = document.getElementById('pc-orders');
  var restEl = document.getElementById('pc-restaurants');
  var resultEl = document.getElementById('pc-result');
  var profitEl = document.getElementById('pc-profit');
  var ctaLineEl = document.getElementById('pc-cta-line');
  var subtitleEl = document.getElementById('pc-subtitle');
  var applyEl = document.getElementById('pc-apply');

  if (applyEl) applyEl.href = applyUrl;
  if (subtitleEl) {
    subtitleEl.textContent = role === 'mr'
      ? 'See how recruiting Recruiter Partners can earn you residual profit. Change the numbers to match your plan.'
      : role === 'rp'
      ? 'See how recruiting Field Sales Partners can earn you residual profit. Change the numbers to match your plan.'
      : 'See how registering restaurants can earn you commission. Change the numbers to match your plan.';
  }

  function num(el, fallback) {
    var n = Number(el && el.value);
    return isFinite(n) && n >= 0 ? n : fallback;
  }

  function money(n) {
    try {
      return new Intl.NumberFormat(undefined, {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0
      }).format(n);
    } catch (e) {
      return '$' + Math.round(n).toLocaleString();
    }
  }

  function plural(n, one, many) {
    return n === 1 ? one : many;
  }

  function calc() {
    var meal = num(mealEl, 25);
    var perDay = num(ordersEl, 10);
    var restaurants = Math.floor(num(restEl, 16));
    var perMonth = perDay * 30;
    var totalOrdersMonth = restaurants * perMonth;
    var volume = totalOrdersMonth * meal;
    var fee = volume * FEE;
    var youEarn = role === 'mr'
      ? fee * (1 - SP_MAX) * MR_MAX
      : role === 'rp'
      ? fee * (1 - SP_MAX) * RP_MAX
      : fee * SP_MAX;

    if (resultEl) {
      if (role === 'mr') {
        resultEl.innerHTML =
          'If Recruiter Partners you invite build teams that register <strong>' + restaurants + ' ' +
          plural(restaurants, 'restaurant', 'restaurants') + '</strong>, and every restaurant gets ' +
          '<strong>' + perDay + ' ' + plural(perDay, 'order', 'orders') + ' per day</strong> at ' +
          '<strong>' + money(meal) + ' meal price</strong>, that is ' +
          '<strong>' + perMonth + ' orders per month</strong> from each restaurant ' +
          '(about <strong>' + totalOrdersMonth.toLocaleString() + ' orders / month</strong> in total). ' +
          'Your estimated residual profit at the max Master Recruiter rate (7.5%) would be:';
      } else if (role === 'rp') {
        resultEl.innerHTML =
          'If Field Sales Partners you invite register <strong>' + restaurants + ' ' +
          plural(restaurants, 'restaurant', 'restaurants') + '</strong>, and every restaurant gets ' +
          '<strong>' + perDay + ' ' + plural(perDay, 'order', 'orders') + ' per day</strong> at ' +
          '<strong>' + money(meal) + ' meal price</strong>, that is ' +
          '<strong>' + perMonth + ' orders per month</strong> from each restaurant ' +
          '(about <strong>' + totalOrdersMonth.toLocaleString() + ' orders / month</strong> in total). ' +
          'Your estimated residual profit at the max rate would be:';
      } else {
        resultEl.innerHTML =
          'If you register <strong>' + restaurants + ' ' +
          plural(restaurants, 'restaurant', 'restaurants') + '</strong>, and every restaurant gets ' +
          '<strong>' + perDay + ' ' + plural(perDay, 'order', 'orders') + ' per day</strong> at ' +
          '<strong>' + money(meal) + ' meal price</strong>, that is ' +
          '<strong>' + perMonth + ' orders per month</strong> from each restaurant ' +
          '(about <strong>' + totalOrdersMonth.toLocaleString() + ' orders / month</strong> in total). ' +
          'Your estimated profit at the max rate would be:';
      }
    }
    if (profitEl) {
      profitEl.textContent = money(youEarn) + ' / month';
    }
    if (ctaLineEl) {
      ctaLineEl.textContent = role === 'mr'
        ? 'Ready to recruit Recruiters? Apply and get your invite link.'
        : role === 'rp'
        ? 'Ready to start recruiting? Apply and get your invite link.'
        : 'Ready to start? Apply, finish training, and register your first restaurants.';
    }
  }

  ['input', 'change'].forEach(function (evt) {
    [mealEl, ordersEl, restEl].forEach(function (el) {
      if (el) el.addEventListener(evt, calc);
    });
  });

  calc();
})();
</script>
