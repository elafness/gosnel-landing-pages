<!--
  Simple marketing profit calculator for SP / HSP / RP job pages.
  Set before include:
    window.GOSNEL_PROFIT_CALC = { role: 'sp' | 'hsp' | 'rp', applyUrl: '...' }
-->
<section id="earn-estimate" class="rounded-3xl border border-teal-100 bg-gradient-to-br from-brand-soft to-white p-6 sm:p-8 shadow-sm">
  <div class="flex items-start gap-3 mb-2">
    <span class="inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-brand text-slate-900 shrink-0">
      <i data-lucide="calculator" class="w-5 h-5"></i>
    </span>
    <div>
      <h2 class="text-2xl font-black text-slate-900">Estimate your profit</h2>
      <p id="pc-subtitle" class="text-sm text-slate-600 mt-1">See how the job works with a simple example. Change the numbers to match your plan.</p>
    </div>
  </div>

  <div id="pc-role-toggle" class="mt-4 hidden flex flex-wrap gap-2">
    <button type="button" data-pc-role="sp" class="pc-role-btn px-3 py-1.5 rounded-full text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:border-brand">SP · 30%</button>
    <button type="button" data-pc-role="hsp" class="pc-role-btn px-3 py-1.5 rounded-full text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:border-brand">HSP · 30%</button>
    <button type="button" data-pc-role="rp" class="pc-role-btn px-3 py-1.5 rounded-full text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:border-brand">RP · 15% residual</button>
  </div>

  <div class="mt-5 grid sm:grid-cols-3 gap-3">
    <label class="block">
      <span class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5">
        <i data-lucide="circle-dollar-sign" class="w-3.5 h-3.5"></i>
        <span id="pc-meal-label">Meal Price</span>
      </span>
      <input
        id="pc-meal"
        type="number"
        min="0"
        step="1"
        value="25"
        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-base font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand"
      />
    </label>
    <label class="block">
      <span class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5">
        <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i>
        <span id="pc-orders-label">Orders Per Day</span>
      </span>
      <input
        id="pc-orders"
        type="number"
        min="0"
        step="1"
        value="10"
        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-base font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand"
      />
    </label>
    <label class="block">
      <span class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5">
        <i data-lucide="store" class="w-3.5 h-3.5"></i>
        <span id="pc-units-label">Active Restaurants</span>
      </span>
      <input
        id="pc-restaurants"
        type="number"
        min="0"
        step="1"
        value="16"
        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-base font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand"
      />
    </label>
  </div>

  <div class="mt-5 rounded-2xl bg-white border border-teal-100 p-5 sm:p-6">
    <p id="pc-result" class="text-slate-700 text-sm sm:text-base leading-relaxed text-left"></p>
    <p id="pc-profit" class="mt-4 text-2xl sm:text-3xl font-black text-brand-dark text-center"></p>
    <p id="pc-cta-line" class="mt-2 text-sm text-slate-500 text-center"></p>
  </div>

  <div class="mt-5 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
    <p class="text-xs text-slate-500">Example only. Flat rates: SP/HSP 30% of GoSnel fee · RP 15% of fee after SP/HSP share. Real earnings depend on real activity.</p>
    <a
      id="pc-apply"
      href="#"
      class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800 transition"
    >
      Apply now
      <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </a>
  </div>
</section>

<script>
(function () {
  var cfg = window.GOSNEL_PROFIT_CALC || {};
  var role = cfg.role === 'rp' ? 'rp' : (cfg.role === 'hsp' ? 'hsp' : 'sp');
  var showToggle = !!cfg.showToggle;
  var applyUrls = {
    sp: 'https://admin.gosnel.com/apply?track=field_sales',
    hsp: 'https://admin.gosnel.com/apply?track=hotel_sales',
    rp: 'https://admin.gosnel.com/apply?track=recruiter'
  };
  var applyUrl = cfg.applyUrl || applyUrls[role] || applyUrls.sp;

  // Flat commission model (no Silver / Gold / Platinum)
  var FEE = 0.15;
  var SP_HSP_SHARE = 0.30;
  var RP_RESIDUAL = 0.15;

  var mealEl = document.getElementById('pc-meal');
  var ordersEl = document.getElementById('pc-orders');
  var restEl = document.getElementById('pc-restaurants');
  var resultEl = document.getElementById('pc-result');
  var profitEl = document.getElementById('pc-profit');
  var ctaLineEl = document.getElementById('pc-cta-line');
  var subtitleEl = document.getElementById('pc-subtitle');
  var applyEl = document.getElementById('pc-apply');
  var mealLabelEl = document.getElementById('pc-meal-label');
  var ordersLabelEl = document.getElementById('pc-orders-label');
  var unitsLabelEl = document.getElementById('pc-units-label');
  var toggleEl = document.getElementById('pc-role-toggle');

  function setApply() {
    applyUrl = cfg.applyUrl || applyUrls[role] || applyUrls.sp;
    if (applyEl) applyEl.href = applyUrl;
  }

  function setLabels() {
    if (subtitleEl) {
      subtitleEl.textContent = role === 'rp'
        ? 'See how recruiting SP and HSP partners can earn you a flat 15% residual. Change the numbers to match your plan.'
        : role === 'hsp'
        ? 'See how registering hotels can earn you a flat 30% of GoSnel hotel fees. Change the numbers to match your plan.'
        : 'See how registering restaurants can earn you a flat 30% of GoSnel’s fee. Change the numbers to match your plan.';
    }
    if (mealLabelEl) mealLabelEl.textContent = role === 'hsp' ? 'Fee / Month (AED)' : 'Meal Price';
    if (ordersLabelEl) ordersLabelEl.textContent = role === 'hsp' ? 'Months' : 'Orders Per Day';
    if (unitsLabelEl) {
      unitsLabelEl.textContent = role === 'hsp' ? 'Active Hotels' : 'Active Restaurants';
    }
    if (role === 'hsp') {
      if (mealEl && (!mealEl.dataset.touched)) mealEl.value = '15';
      if (ordersEl && (!ordersEl.dataset.touched)) ordersEl.value = '1';
      if (restEl && (!restEl.dataset.touched)) restEl.value = '5';
    } else if (!mealEl.dataset.touched && !ordersEl.dataset.touched && !restEl.dataset.touched) {
      if (mealEl) mealEl.value = '25';
      if (ordersEl) ordersEl.value = '10';
      if (restEl) restEl.value = '16';
    }
  }

  function paintToggle() {
    if (!toggleEl) return;
    if (showToggle) {
      toggleEl.classList.remove('hidden');
      toggleEl.classList.add('flex');
    }
    Array.prototype.forEach.call(toggleEl.querySelectorAll('.pc-role-btn'), function (btn) {
      var active = btn.getAttribute('data-pc-role') === role;
      btn.classList.toggle('bg-brand', active);
      btn.classList.toggle('text-slate-900', active);
      btn.classList.toggle('border-brand', active);
      btn.classList.toggle('bg-white', !active);
      btn.classList.toggle('text-slate-700', !active);
    });
  }

  setApply();
  setLabels();
  paintToggle();

  if (toggleEl) {
    toggleEl.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-pc-role]');
      if (!btn) return;
      role = btn.getAttribute('data-pc-role');
      if (role !== 'sp' && role !== 'hsp' && role !== 'rp') return;
      cfg.applyUrl = null;
      setApply();
      setLabels();
      paintToggle();
      calc();
    });
  }

  function num(el, fallback) {
    var n = Number(el && el.value);
    return isFinite(n) && n >= 0 ? n : fallback;
  }

  function money(n) {
    try {
      return new Intl.NumberFormat(undefined, {
        style: 'currency',
        currency: role === 'hsp' ? 'AED' : 'USD',
        maximumFractionDigits: 0
      }).format(n);
    } catch (e) {
      return (role === 'hsp' ? 'AED ' : '$') + Math.round(n).toLocaleString();
    }
  }

  function plural(n, one, many) {
    return n === 1 ? one : many;
  }

  function calc() {
    var meal = num(mealEl, role === 'hsp' ? 15 : 25);
    var perDay = num(ordersEl, role === 'hsp' ? 1 : 10);
    var restaurants = Math.floor(num(restEl, role === 'hsp' ? 5 : 16));
    var fee;
    var youEarn;
    var perMonth;
    var totalOrdersMonth;
    var volume;

    if (role === 'hsp') {
      // Simple hotel example: monthly fee × hotels × months × flat 30%
      var months = Math.max(1, Math.floor(perDay));
      fee = meal * restaurants * months;
      youEarn = fee * SP_HSP_SHARE;
    } else {
      perMonth = perDay * 30;
      totalOrdersMonth = restaurants * perMonth;
      volume = totalOrdersMonth * meal;
      fee = volume * FEE;
      youEarn = role === 'rp'
        ? fee * (1 - SP_HSP_SHARE) * RP_RESIDUAL
        : fee * SP_HSP_SHARE;
    }

    if (resultEl) {
      if (role === 'hsp') {
        var monthsTxt = Math.max(1, Math.floor(perDay));
        resultEl.innerHTML =
          'If you register <strong>' + restaurants + ' ' +
          plural(restaurants, 'hotel', 'hotels') + '</strong>, and each pays GoSnel about ' +
          '<strong>' + money(meal) + ' / month</strong> in fees' +
          (monthsTxt > 1 ? (' over <strong>' + monthsTxt + ' months</strong>') : '') +
          ', your estimated profit at the flat <strong>30%</strong> HSP rate would be' +
          (monthsTxt > 1 ? ':' : ' <strong>per month</strong>:');
      } else if (role === 'rp') {
        resultEl.innerHTML =
          'If Field Sales or Hotel Sales Partners you invite register <strong>' + restaurants + ' ' +
          plural(restaurants, 'restaurant', 'restaurants') + '</strong>, and every restaurant gets ' +
          '<strong>' + perDay + ' ' + plural(perDay, 'order', 'orders') + ' per day</strong> at ' +
          '<strong>' + money(meal) + ' meal price</strong>, that is ' +
          '<strong>' + perMonth + ' orders per month</strong> from each restaurant ' +
          '(about <strong>' + totalOrdersMonth.toLocaleString() + ' orders / month</strong> in total). ' +
          'After their flat 30% share, your estimated residual at <strong>15%</strong> of GoSnel net would be:';
      } else {
        resultEl.innerHTML =
          'If you register <strong>' + restaurants + ' ' +
          plural(restaurants, 'restaurant', 'restaurants') + '</strong>, and every restaurant gets ' +
          '<strong>' + perDay + ' ' + plural(perDay, 'order', 'orders') + ' per day</strong> at ' +
          '<strong>' + money(meal) + ' meal price</strong>, that is ' +
          '<strong>' + perMonth + ' orders per month</strong> from each restaurant ' +
          '(about <strong>' + totalOrdersMonth.toLocaleString() + ' orders / month</strong> in total). ' +
          'Your estimated profit at the flat <strong>30%</strong> SP rate would be:';
      }
    }
    if (profitEl) {
      if (role === 'hsp' && Math.max(1, Math.floor(perDay)) > 1) {
        profitEl.textContent = money(youEarn) + ' total';
      } else {
        profitEl.textContent = money(youEarn) + ' / month';
      }
    }
    if (ctaLineEl) {
      ctaLineEl.textContent = role === 'rp'
        ? 'Ready to start recruiting SP and HSP? Apply and get your invite link.'
        : role === 'hsp'
        ? 'Ready to start? Apply, finish training, and register your first hotels.'
        : 'Ready to start? Apply, finish training, and register your first restaurants.';
    }
  }

  ['input', 'change'].forEach(function (evt) {
    [mealEl, ordersEl, restEl].forEach(function (el) {
      if (el) {
        el.addEventListener(evt, function () {
          el.dataset.touched = '1';
          calc();
        });
      }
    });
  });

  calc();
})();
</script>
