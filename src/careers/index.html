<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers at GoSnel - Join Our Team</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Noto Sans Arabic', 'sans-serif'] },
                    colors: { brand: { DEFAULT: '#4ecdc4', hover: '#3db5ac' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; color: #0f172a; margin: 0; line-height: 1.6; overflow-x: hidden; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 100; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal.active { display: flex; animation: fadeIn 0.2s ease-out; }
        .modal-content { animation: slideUp 0.3s ease-out; }
        .btn-whatsapp { background-color: #25D366; transition: all 0.2s; }
        .btn-whatsapp:hover { background-color: #20ba5a; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 211, 102, 0.3); }
        [dir="rtl"] { font-family: 'Noto Sans Arabic', 'Inter', sans-serif; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="font-sans antialiased">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="/" class="flex items-center group">
                    <img src="https://pub-0d4798289dad4074a3236450ba640652.r2.dev/gosnelicon.png" alt="GoSnel Logo" class="h-10 w-auto group-hover:scale-105 transition-transform">
                    <span class="ms-3 text-2xl font-extrabold tracking-tight text-slate-900" data-translate="brand">GoSnel</span>
                </a>
                <button onclick="toggleLanguage()" class="flex items-center px-4 py-2 rounded-full border border-slate-200 hover:bg-slate-100 transition-colors text-sm font-semibold text-slate-700">
                    <i data-lucide="globe" class="w-4 h-4 me-2"></i>
                    <span id="langText">العربية</span>
                </button>
            </div>
        </div>
    </header>

    <section class="relative bg-slate-900 py-32 overflow-hidden">
        <div class="absolute inset-0 opacity-40">
            <img src="https://pub-0d4798289dad4074a3236450ba640652.r2.dev/heroimage.webp" alt="GoSnel Team" class="w-full h-full object-cover">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80"></div>
        <div class="relative max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-6 leading-tight" data-translate="heroTitle">Join the GoSnel Team</h1>
            <p class="text-xl text-slate-200 mb-10 max-w-2xl mx-auto" data-translate="heroSubtitle">We're building the future of food discovery. Help us change how people find and order meals.</p>
            <a href="#jobs" class="inline-flex items-center px-8 py-4 rounded-xl bg-brand text-slate-900 font-bold text-lg hover:bg-brand-hover hover:shadow-lg transition-all">
                <span data-translate="viewOpenings">View Openings</span>
                <i data-lucide="arrow-down" class="ms-2 w-5 h-5"></i>
            </a>
        </div>
    </section>

    <section id="jobs" class="max-w-7xl mx-auto px-4 py-24">
        <div class="flex items-center justify-between mb-12">
            <h2 class="text-3xl font-bold flex items-center text-slate-900" data-translate="openPositions">
                <i data-lucide="briefcase" class="me-3 text-brand w-8 h-8"></i> Open Positions
            </h2>
            <span class="bg-brand/10 text-brand-hover px-4 py-1 rounded-full font-bold text-sm">6 Roles</span>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="jobs-container" class="contents"></div>
        </div>
    </section>

    <footer class="bg-white border-t border-slate-200 py-12 text-center">
        <p class="text-slate-500 font-medium" data-translate="footerText">© 2026 GoSnel AI. All rights reserved.</p>
    </footer>

    <div id="job-modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content bg-white rounded-3xl p-8 max-w-lg w-full relative shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="closeModal(null, true)" class="absolute top-5 end-5 text-slate-400 hover:text-red-500 transition-colors bg-slate-100 hover:bg-red-50 rounded-full p-2">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="flex gap-2 mb-4">
                <span id="modal-type" class="px-3 py-1 rounded-md bg-blue-50 text-blue-700 text-xs font-bold uppercase tracking-wider"></span>
                <span id="modal-loc" class="px-3 py-1 rounded-md bg-emerald-50 text-emerald-700 text-xs font-bold uppercase tracking-wider"></span>
            </div>

            <h3 id="modal-title" class="text-2xl font-extrabold mb-3 text-slate-900"></h3>
            <p id="modal-desc" class="text-slate-600 mb-8 leading-relaxed"></p>
            
            <a id="modal-wa-link" href="#" target="_blank" class="w-full py-4 rounded-xl btn-whatsapp text-white font-bold flex items-center justify-center text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="me-2 fill-current">
                    <path d="M16.6 14c-.2-.1-1.5-.7-1.7-.8c-.2-.1-.4-.1-.6.1c-.2.2-.6.8-.8 1c-.1.2-.3.2-.5.1c-.7-.3-1.4-.7-2-1.2c-.5-.5-1-1.1-1.4-1.7c-.1-.2 0-.4.1-.5c.1-.1.2-.3.4-.4c.1-.1.2-.3.2-.4c.1-.1.1-.3 0-.4c-.1-.1-.6-1.3-.8-1.8c-.1-.7-.3-.7-.5-.7h-.5c-.2 0-.5.2-.6.3c-.6.6-.9 1.3-.9 2.1c.1.9.4 1.8 1 2.6c1.1 1.6 2.5 2.9 4.2 3.7c.5.2.9.4 1.4.5c.5.2 1 .2 1.6.1c.7-.1 1.3-.6 1.7-1.2c.2-.4.2-.8.1-1.2l-.4-.2m2.5-9.1C15.2 1 8.9 1 5 4.9c-3.2 3.2-3.8 8.1-1.6 12L2 22l5.3-1.4c1.5.8 3.1 1.2 4.7 1.2c5.5 0 9.9-4.4 9.9-9.9c.1-2.6-1-5.1-2.8-7m-2.7 14c-1.3.8-2.8 1.3-4.4 1.3c-1.5 0-2.9-.4-4.2-1.1l-.3-.2l-3.1.8l.8-3l-.2-.3c-2.4-4-1.2-9 2.7-11.5S16.6 3.7 19 7.5c2.4 3.9 1.3 9-2.6 11.4"/>
                </svg>
                <span data-translate="applyNow">Apply via WhatsApp</span>
            </a>
        </div>
    </div>

    <script>
        // --- 1. قاعدة بيانات الوظائف والنصوص ---
        const translations = {
            en: {
                brand: "GoSnel", langName: "العربية",
                heroTitle: "Join the GoSnel Team",
                heroSubtitle: "We're building the future of food discovery. Help us change how people find and order meals.",
                viewOpenings: "View Openings", openPositions: "Open Positions", applyNow: "Apply via WhatsApp", footerText: "© 2026 GoSnel AI. All rights reserved.",
                viewDetails: "View Details & Apply",
                
                // الوظائف
                jobs: [
                    { id: 1, title: "Sales Coordinator", type: "Full-time", loc: "Remote", desc: "Support our sales team and drive customer acquisition..." },
                    { id: 2, title: "Field Sales Representative", type: "Part-time", loc: "On-site", desc: "Build relationships with restaurant partners and expand our network..." },
                    { id: 3, title: "Operations Coordinator", type: "Full-time", loc: "On-site", desc: "Manage day-to-day operations and ensure smooth business processes..." },
                    { id: 4, title: "Marketing Assistant", type: "Part-time", loc: "Remote", desc: "Create compelling content and campaigns to grow our brand..." },
                    { id: 5, title: "Admin Executive", type: "Full-time", loc: "On-site", desc: "Manage administrative tasks and support the executive team..." },
                    { id: 6, title: "Data Entry Specialist", type: "Full-time", loc: "Remote", desc: "Accurately input and manage data to support business operations..." }
                ]
            },
            ar: {
                brand: "جوسنل", langName: "English",
                heroTitle: "انضم إلى فريق جوسنل",
                heroSubtitle: "نحن نبني مستقبل اكتشاف الطعام. ساعدنا في تغيير طريقة بحث وطلب الناس للوجبات.",
                viewOpenings: "استعرض الوظائف", openPositions: "الوظائف المتاحة", applyNow: "قدم عبر الواتساب", footerText: "© 2026 جوسنل للذكاء الاصطناعي. جميع الحقوق محفوظة.",
                viewDetails: "التفاصيل والتقديم",

                // الوظائف باللغة العربية
                jobs: [
                    { id: 1, title: "منسق مبيعات", type: "دوام كامل", loc: "عن بعد", desc: "دعم فريق المبيعات لدينا ودفع عملية اكتساب العملاء..." },
                    { id: 2, title: "مندوب مبيعات ميداني", type: "دوام جزئي", loc: "حضوري", desc: "بناء علاقات مع شركائنا من المطاعم وتوسيع شبكتنا..." },
                    { id: 3, title: "منسق عمليات", type: "دوام كامل", loc: "حضوري", desc: "إدارة العمليات اليومية وضمان سير إجراءات العمل بسلاسة..." },
                    { id: 4, title: "مساعد تسويق", type: "دوام جزئي", loc: "عن بعد", desc: "إنشاء محتوى وحملات جذابة لتنمية علامتنا التجارية..." },
                    { id: 5, title: "مسؤول إداري", type: "دوام كامل", loc: "حضوري", desc: "إدارة المهام الإدارية ودعم الفريق التنفيذي..." },
                    { id: 6, title: "أخصائي إدخال بيانات", type: "دوام كامل", loc: "عن بعد", desc: "إدخال وإدارة البيانات بدقة لدعم العمليات التجارية..." }
                ]
            }
        };

        let currentLang = 'en';

        // --- 2. دالة توليد البطاقات ديناميكياً ---
        function renderJobs() {
            const container = document.getElementById('jobs-container');
            container.innerHTML = ''; // مسح القديم
            
            const currentJobs = translations[currentLang].jobs;
            const btnText = translations[currentLang].viewDetails;

            currentJobs.forEach((job, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full group cursor-pointer";
                card.onclick = () => openModal(index);
                
                card.innerHTML = `
                    <div class="flex gap-2 mb-4">
                        <span class="px-3 py-1 rounded-md bg-blue-50 text-blue-700 text-xs font-bold uppercase tracking-wider">${job.type}</span>
                        <span class="px-3 py-1 rounded-md bg-emerald-50 text-emerald-700 text-xs font-bold uppercase tracking-wider">${job.loc}</span>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900 group-hover:text-brand transition-colors">${job.title}</h3>
                    <p class="text-slate-500 mb-6 text-sm flex-grow">${job.desc}</p>
                    <div class="pt-4 border-t border-slate-100 mt-auto flex items-center justify-between text-brand font-semibold text-sm">
                        ${btnText} <i data-lucide="arrow-${currentLang === 'en' ? 'right' : 'left'}" class="w-4 h-4"></i>
                    </div>
                `;
                container.appendChild(card);
            });
            
            lucide.createIcons();
        }

        // --- 3. دوال الترجمة والتحكم ---
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            
            document.getElementById('langText').textContent = translations[currentLang].langName;
            
            // ترجمة النصوص الثابتة
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
            
            // إعادة رسم بطاقات الوظائف باللغة الجديدة
            renderJobs();
        }

        // --- 4. دوال النافذة المنبثقة (Modal) ---
        function openModal(jobIndex) {
            const job = translations[currentLang].jobs[jobIndex];
            
            // تعبئة البيانات
            document.getElementById('modal-title').textContent = job.title;
            document.getElementById('modal-type').textContent = job.type;
            document.getElementById('modal-loc').textContent = job.loc;
            document.getElementById('modal-desc').textContent = job.desc;
            
            // تجهيز رابط الواتساب (تشفير النص ليكون جاهز للواتساب)
            const waMessage = encodeURIComponent(`Hi GoSnel team, I'm interested in the ${translations['en'].jobs[jobIndex].title} position.`);
            document.getElementById('modal-wa-link').href = `https://wa.me/971500000000?text=${waMessage}`; // ضع رقمك الحقيقي هنا

            // إظهار النافذة
            document.getElementById('job-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event, force = false) {
            if (force || event.target.classList.contains('modal')) {
                document.getElementById('job-modal').classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(null, true); });

        // تهيئة الصفحة عند التحميل
        renderJobs();
    </script>
</body>
</html>
