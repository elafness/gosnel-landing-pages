<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Circular gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Main circular background -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- GoSnel brand text -->
  <text x="50" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="white" letter-spacing="0.5px">GoSnel</text>
  
  <!-- Food discovery icon - stylized as connected dots forming a pattern -->
  <g transform="translate(50,50)">
    <!-- Central hub -->
    <circle cx="0" cy="8" r="2.5" fill="white" opacity="0.9"/>
    
    <!-- Connected nodes representing restaurants/food options -->
    <circle cx="-12" cy="4" r="2" fill="white" opacity="0.7"/>
    <circle cx="12" cy="4" r="2" fill="white" opacity="0.7"/>
    <circle cx="-8" cy="18" r="2" fill="white" opacity="0.7"/>
    <circle cx="8" cy="18" r="2" fill="white" opacity="0.7"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="8" x2="-12" y2="4" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="8" x2="12" y2="4" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="8" x2="-8" y2="18" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="8" x2="8" y2="18" stroke="white" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Subtle outer ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
</svg>
